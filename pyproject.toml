[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "pihome-hub"
version = "0.1.0"
description = "Self-hosted HTTP control plane for Raspberry Pi relays, sensors and home automation rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Roman Pelenychko" }]
keywords = ["raspberry-pi", "gpio", "relay", "home-automation", "fastapi", "smart-home"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: No Input/Output (Daemon)",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]

# Exact pins, not ranges: this is a deployed application, not a library, and the
# target device is a Raspberry Pi that is provisioned once and then left running
# for months. Reproducible installs matter more than dependency flexibility.
dependencies = [
  # Sunrise/sunset for after-dark automation. Works with the standard library's
  # zoneinfo, so no separate timezone dependency is needed.
  "astral==3.2",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.3",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
# Hardware access. Kept out of the base install so the service can run — and be
# developed and tested — on any machine using the mock backend.
rpi = [
  "gpiozero==2.0.1.post3",
  "lgpio==0.2.2.0",
]
dev = [
  # Starlette's TestClient requires httpx2; the original httpx is deprecated for
  # this use and emits a warning that the suite treats as an error.
  "httpx2==2.9.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
pihome-hub = "pihome_hub.__main__:main"
pihome-hub-admin = "pihome_hub.admin:main"

[project.urls]
Homepage = "https://github.com/DGPRoman/pihome-hub"
Issues = "https://github.com/DGPRoman/pihome-hub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pihome_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "RET",   # flake8-return
  "RUF",   # ruff-specific
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "T20",   # flake8-print
  "TID",   # flake8-tidy-imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test suite, and its fixtures necessarily contain
# literal (synthetic) credentials.
# Literal values are a test's specification, and helper factories legitimately take
# one keyword per field they build.
"tests/**" = ["S101", "S105", "S106", "S107", "PLR0913", "PLR2004"]
# A settings-override helper forwards arbitrary keyword values by design.
"tests/conftest.py" = ["ANN401", "S101", "S105", "S106", "S107"]
# Parametrised over deliberately wrong types, which is what the test asserts about.
"tests/sensors/test_models.py" = ["ANN401", "PLR2004", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# gpiozero ships no type stubs and no py.typed marker, so mypy will not look inside
# it unless told to. Both settings are needed, for opposite situations:
# ignore_missing_imports covers the base install, where the package is genuinely
# absent; follow_untyped_imports covers the rpi extra, where it is present and mypy
# would otherwise still hand back Any for every symbol. Without the second one a
# misspelled keyword — pull_upp for pull_up — type-checks clean and only shows up as
# a relay reading the wrong level on real hardware.
module = ["gpiozero.*"]
ignore_missing_imports = true
follow_untyped_imports = true
# gpiozero's package __init__ re-exports with a plain star import and no __all__,
# which strict mode reads as "not exported". That is a statement about gpiozero's
# packaging, not about whether the symbol exists — and an attribute that genuinely
# is not there still fails.
implicit_reexport = true

[[tool.mypy.overrides]]
# Every gpiozero entry point is an untyped function, so strict mode objects to each
# call on that ground alone. Silencing the category here rather than the whole file
# keeps what following the import was for: argument names, arity and attribute
# existence are still checked against the real library.
module = ["pihome_hub.relays.gpio"]
disallow_untyped_calls = false

[tool.uv]
# The lockfiles are only reproducible against the resolver that produced them:
# different uv versions annotate a resolution differently, which shows up as the
# lockfile check failing on files whose pins are byte-identical. Declared here
# rather than in the workflow because uv enforces it for a developer too, and
# setup-uv reads it — so CI and a checkout cannot drift apart silently. Moving it
# is deliberate: bump this line and run requirements/refresh.sh in the same commit.
required-version = "==0.12.10"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
  "error",
  # starlette's testclient module reads anyio.abc.BlockingPortal in its module body,
  # an alias anyio 4.15 deprecated. It fires at import, before any test runs, so
  # "error" turns it into a collection failure that takes the whole session down —
  # and no change here avoids it: starlette 1.6.0 is the newest release and still
  # does it. Scoped to the one message, so every other deprecation, this project's
  # included, stays an error. Remove once starlette uses anyio.from_thread.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
