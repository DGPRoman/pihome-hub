# What tells us a dependency has moved.
#
# Dependabot rather than a scheduled workflow, for a reason specific to these
# repositories: GitHub Actions is not permitted to create pull requests in this
# organisation, which is what removed release-please. Dependabot is a separate
# service and is not subject to that setting, so it is the one mechanism here that
# can actually open a branch on its own.
#
# Grouped and weekly. One pull request per package, several times a week, is a
# stream nobody reads — and a security update is only useful if it is noticed
# among the rest.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: ["chore"]

  # The Python side is a weaker fit, and it is here with its eyes open.
  #
  # requirements/*.txt are generated by `uv pip compile` and CI asserts they are
  # reproducible from pyproject.toml: the lockfile job regenerates them and fails
  # on any diff. Dependabot writes those files itself, with its own formatting for
  # the `# via` annotations, so its first pull request may fail that job.
  #
  # That is still worth having. The failure is loud, it is not a false alarm about
  # the dependency, and the fix is one command on the branch:
  #
  #     requirements/refresh.sh && git commit -am 'build: refresh the lockfiles'
  #
  # If it turns out to fail every time rather than once, delete this block: the
  # actions group above is the half that carries most of the risk anyway.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
    labels: ["chore"]
