# What tells us a dependency has moved.
#
# Dependabot rather than a scheduled workflow, for a reason specific to these
# repositories: GitHub Actions is not permitted to create pull requests in this
# organisation, which is what removed release-please. Dependabot is a separate
# service and is not subject to that setting, so it is the one mechanism here that
# can actually open a branch on its own.
#
# Grouped and weekly. One pull request per package, several times a week, is a
# stream nobody reads — and a security update is only useful if it is noticed
# among the rest.
#
# Actions only. There was a pip entry here and it had to go: requirements/*.txt
# are produced by `uv pip compile`, which writes a *solved* dependency graph, and
# Dependabot updates packages one at a time. Its first attempt bumped
# pydantic-core to 2.49.0 while pydantic 2.13.5 pins it to 2.46.4 exactly, and the
# result would not install on any of the four environments CI builds. That is not
# a formatting quarrel the way it was first written up here — it is what updating
# one member of a solved graph does, so no configuration of it would be right.
#
# The Python side is watched by .github/workflows/dependencies.yml instead, which
# re-solves the whole graph and reports what moved.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: ["chore"]
