name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Format check
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy

      - name: Ensure no secrets are tracked
        # A committed credential cannot be un-published, so this is checked on every
        # run rather than trusting .gitignore to stay correct.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git — it must never be committed"
            exit 1
          fi
          echo "No .env in the index."

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the system Python on Raspberry Pi OS (Bookworm) and therefore
        # the deployment target; the newer versions guard against bit rot.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install 'build==1.3.0'
          python -m build

      - name: Verify the wheel installs, and refuses to start unconfigured
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          # A missing key must abort startup rather than serve unauthenticated.
          if /tmp/verify/bin/pihome-hub 2>/tmp/err.log; then
            echo "::error::service started without credentials configured"
            exit 1
          fi
          cat /tmp/err.log
          grep -q "PIHOME_RELAY_API_KEY" /tmp/err.log
          echo "Startup correctly refused an incomplete configuration."
