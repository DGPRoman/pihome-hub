name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        # From the lockfile, with hashes, so what CI proves is a specific set of
        # transitive versions rather than whatever resolved that morning. --no-deps
        # on the package: its dependencies are pinned above, and without it pip is
        # free to re-resolve and undo the lock.
        run: |
          pip install --require-hashes --requirement requirements/dev.txt
          pip install -e . --no-deps

      - name: Format check
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy

      - name: Ensure no secrets are tracked
        # A committed credential cannot be un-published, so this is checked on every
        # run rather than trusting .gitignore to stay correct.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git — it must never be committed"
            exit 1
          fi
          echo "No .env in the index."

  deploy-files:
    name: Deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the install script
        # ruff and mypy cannot read shell, so this is the only thing standing between an
        # unquoted expansion and a Raspberry Pi.
        run: shellcheck --severity=style deploy/install.sh

      - name: Verify the unit with systemd-analyze
        # A misspelled directive is silently ignored by systemd — and reported here as a
        # warning that still exits 0 — so the output, not the status, is the check. Stub
        # the ExecStart path first: an absent binary is the one complaint expected on a
        # runner, and stubbing it is cheaper than pattern-matching the message.
        run: |
          sudo install -d /opt/pihome-hub/.venv/bin
          sudo ln -sf /usr/bin/true /opt/pihome-hub/.venv/bin/pihome-hub

          output=$(systemd-analyze verify deploy/pihome-hub.service 2>&1)
          if [ -n "$output" ]; then
            echo "$output"
            echo "::error file=deploy/pihome-hub.service::systemd-analyze reported a problem"
            exit 1
          fi
          echo "Unit file is valid."

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Check the lockfiles match pyproject.toml
        # A lockfile nobody regenerates is a lockfile that quietly stops describing
        # the project. Recompiling without --upgrade keeps the existing pins as
        # preferences, so this only moves when pyproject.toml has actually changed.
        # Running the same script a developer runs, rather than a second copy of the
        # commands: two spellings of the same compile differ in the command line uv
        # records at the top of each file, and the check fails on that alone.
        run: |
          requirements/refresh.sh
          if ! git diff --exit-code -- requirements/; then
            echo "::error::requirements/ is out of date — run requirements/refresh.sh"
            exit 1
          fi
          echo "Lockfiles are current."

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the system Python on Raspberry Pi OS (Bookworm) and therefore
        # the deployment target; the newer versions guard against bit rot.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        # From the lockfile, with hashes, so what CI proves is a specific set of
        # transitive versions rather than whatever resolved that morning. --no-deps
        # on the package: its dependencies are pinned above, and without it pip is
        # free to re-resolve and undo the lock.
        run: |
          pip install --require-hashes --requirement requirements/dev.txt
          pip install -e . --no-deps

      - name: Test
        run: pytest

  test-hardware-extra:
    name: Test (hardware extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The system Python on Raspberry Pi OS (Bookworm), which is where the
          # extra actually gets installed.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install SWIG
        # lgpio publishes no wheels at all, only an sdist that builds a SWIG
        # extension, so the extra cannot be installed anywhere without it. A Pi is
        # served a prebuilt wheel by piwheels and never notices; a runner compiles.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swig

      - name: Install
        # The hardware extra, which deploy/install.sh installs on the deployment
        # target. Every other leg installs without it, so until this one existed
        # nothing in CI ever imported relays/gpio.py — it had neither runtime nor
        # type verification.
        run: |
          pip install --require-hashes --requirement requirements/dev-rpi.txt
          pip install -e . --no-deps

      - name: Test
        run: pytest

      - name: Type check
        # gpiozero being present is the whole point: mypy follows into it here and
        # checks the real constructor signatures instead of the Any the other leg gets.
        run: mypy

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install 'build==1.3.0'
          python -m build

      - name: Verify the wheel installs, and refuses to start unconfigured
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          # A missing key must abort startup rather than serve unauthenticated.
          if /tmp/verify/bin/pihome-hub 2>/tmp/err.log; then
            echo "::error::service started without credentials configured"
            exit 1
          fi
          cat /tmp/err.log
          grep -q "PIHOME_RELAY_API_KEY" /tmp/err.log
          echo "Startup correctly refused an incomplete configuration."
